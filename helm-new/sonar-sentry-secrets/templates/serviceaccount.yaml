{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sonar-sentry-secrets.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sonar-sentry-secrets.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
