serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

## Override the following section as needed
sonar:
  secret:
    name: "sonar-sentry-secrets"
  sonarApiKey: "OVERRIDE_ME(GUID)"
  # tr -dc a-z0-9 </dev/urandom | head -c 4`-`tr -dc a-z0-9 </dev/urandom | head -c 4
  sentryAuthToken: "OVERRIDE using --set (AAAA-AAAA)"