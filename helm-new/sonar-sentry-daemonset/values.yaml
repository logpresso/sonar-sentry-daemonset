imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# REMOVED: DaemonSet does not need a service
# service:

# REMOVED: DaemonSet does not need ingress
ingress:
  enabled: false

resources:
  limits:
    cpu: 1500m
    memory: 512Mi
  requests:
    cpu: 1001m
    memory: 384Mi

# not supported yet
# livenessProbe:
# readinessProbe:

# not supported yet
autoscaling:
  enabled: false

# Additional volumes on the output Deployment definition.
volumes:
  - name: k8s-log
    hostPath:
      path: /var/log
  - name: k8s-log-var-log-pods
    hostPath:
      path: /var/log/pods
  - name: k8s-log-var-log-containers
    hostPath:
      path: /var/log/containers
  - name: k8s-log-var-lib-containers
    hostPath:
      path: /var/lib/containers
  - name: dd-var-lib-docker
    hostPath:
      path: /var/lib/docker
  - name: app-logs
    hostPath:
      path: /log/WAS/tlo

# Additional volumeMounts on the output Deployment definition.
volumeMounts:
  - name: k8s-log
    mountPath: /var/log/node
  - name: k8s-log-var-log-pods
    mountPath: /var/log/pods
  - name: k8s-log-var-log-containers
    mountPath: /var/log/containers
  - name: k8s-log-var-lib-containers
    mountPath: /var/lib/containers
  - name: dd-var-lib-docker
    mountPath: /var/lib/docker
  - name: app-logs
    mountPath: /in-daemonset/log/WAS/tlo

nodeSelector: 
  {}
  # "namespace/roles": node_value

tolerations: []

affinity: {}

## Override the following section as needed
sonar:
  deploymentType: "DaemonSet" # DaemonSet or Deployment
  resetIfOlderThan: ""  # Format: "2024-03-14 15:04:05", must be in UTC
  guidPrefix: ""
  deployUrl: https://TENANT.logpresso.cloud:44300 
  baseAddr: TENANT.nlb.logpresso.cloud
  deployApiPort: 443
  sentryImageVersion: latest
  sentryInstallationPath: "" # Set the path to install Sentry on EFS volume to prevent logging-state loss. Configure according to your EFS volume mount settings.
  useNamespaceInHostPath: false # Set to true to add namespace name to host path when deploying to multiple namespaces.
  secret:
    name: "sonar-sentry-secrets"