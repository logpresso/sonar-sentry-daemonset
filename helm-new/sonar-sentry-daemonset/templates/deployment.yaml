apiVersion: apps/v1
kind: {{ include "sonar-sentry.deploymentType" . }}
metadata:
  name: {{ include "sonar-sentry.fullname" . }}
  labels:
    {{- include "sonar-sentry.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook-weight": "5"
spec:
  {{- if eq (include "sonar-sentry.deploymentType" .) "Deployment" }}
  replicas: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "sonar-sentry.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "sonar-sentry.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "sonar-sentry.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 120
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "public.ecr.aws/z5g1b4t8/sonar-sentry-dev:{{ .Values.sonar.sentryImageVersion | default "latest" }}"
          imagePullPolicy: Always
          ports:
            - name: sentry-diag
              containerPort: 7022
              protocol: TCP
            - name: sentry-syslog
              containerPort: 514
              protocol: UDP
          envFrom:
          - secretRef:
              name: {{ .Values.sonar.secret.name }}
          env:
            - name: DEPLOY_URL
              value: "{{- .Values.sonar.deployUrl -}}"
            - name: BASE_ADDR
              value: "{{- .Values.sonar.baseAddr -}}"
            - name: "SENTRY_GUID_PREFIX"
              value: "{{- include "sonar-sentry.guidPrefix" . -}}"
            - name: DEPLOY_API_PORT
              value: "{{ default 443 .Values.sonar.deployApiPort }}"
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: SONAR_LOGGERS_CONFIG_PATH
              value: "/etc/sonar/loggers/loggers.json"
            {{- with .Values.env }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            limits:
              cpu: {{ .Values.resources.limits.cpu | default "500m" }}
              memory: {{ .Values.resources.limits.memory | default "512Mi" }}
            requests:
              cpu: {{ .Values.resources.requests.cpu | default "200m" }}
              memory: {{ .Values.resources.requests.memory | default "256Mi" }}
          volumeMounts:
          - name: sentry-installation
            mountPath: /opt/logpresso-sentry
          {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 10 }}
          {{- end }}
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "/root/shutdown.sh"]
      volumes:
      - name: sentry-installation
        {{- if or true (eq (include "sonar-sentry.deploymentType" .) "DaemonSet") }}
        hostPath:
          type: DirectoryOrCreate
          path: /var/local/logpresso-sentry
        {{- else }}
        persistentVolumeClaim:
          claimName: {{ include "sonar-sentry.fullname" . }}-pvc
          readOnly: false 
        {{- end }}
      {{- with .Values.volumes }}
        {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
