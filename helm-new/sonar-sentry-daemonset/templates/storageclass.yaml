{{- if and false (eq (include "sonar-sentry.deploymentType" .) "Deployment") }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ include "sonar-sentry.fullname" . }}-sc
  labels:
    {{- include "sonar-sentry.labels" . | nindent 4 }}
provisioner: ebs.csi.aws.com
parameters:
  type: gp2
  encrypted: "true"
volumeBindingMode: Immediate
allowedTopologies:
  - matchLabelExpressions:
    - key: topology.ebs.csi.aws.com/zone
      values:
        - {{ .Values.sonarSentryPvc.availabilityZone }}
{{- end }}